apiVersion: v1
kind: ServiceAccount
metadata:
  name: thesis-deployer
  namespace: thesis-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: thesis-deployer-role
  namespace: thesis-staging
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: thesis-deployer-binding
  namespace: thesis-staging
subjects:
  - kind: ServiceAccount
    name: thesis-deployer
    namespace: thesis-staging
roleRef:
  kind: Role
  name: thesis-deployer-role
  apiGroup: rbac.authorization.k8s.io
---
