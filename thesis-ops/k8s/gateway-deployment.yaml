apiVersion: apps/v1
kind: Deployment
metadata:
  name: thesis-gateway
  namespace: thesis-staging
  labels:
    app: thesis-gateway
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: thesis-gateway
  template:
    metadata:
      labels:
        app: thesis-gateway
    spec:
      serviceAccountName: thesis-deployer
      containers:
        - name: gateway
          image: ghcr.io/caoyb888/thesis-gateway:staging
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: staging
            - name: NACOS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: thesis-config
                  key: nacos.addr
            - name: NACOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: thesis-secrets
                  key: nacos.password
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: thesis-gateway
  namespace: thesis-staging
spec:
  selector:
    app: thesis-gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: thesis-config
  namespace: thesis-staging
data:
  nacos.addr: "nacos.thesis-infra.svc.cluster.local:8848"
---
apiVersion: v1
kind: Secret
metadata:
  name: thesis-secrets
  namespace: thesis-staging
type: Opaque
stringData:
  nacos.password: "nacos"
